name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas
        # SDL sin pantalla en CI: usamos el driver "dummy" para que Pygame no
        # necesite un monitor real.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest tests/

  security:
    name: Analisis de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Auditar vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Analisis estatico de codigo (bandit)
        run: bandit -r tetris main.py tools
